<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Primary SEO -->
  <title>NexAlc — Free Online Calculators for Everyday Decisions</title>
  <meta name="description" content="Free, fast, and accurate online calculators for mortgage, BMI, currency, percentage, age, tip, and countdowns. No sign-up. Free forever." />
  <link rel="canonical" href="https://nexalc.com/1" />
  <meta name="robots" content="index, follow" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://nexalc.com/" />
  <meta property="og:title" content="NexAlc — Free Online Calculators" />
  <meta property="og:description" content="Fast, accurate, free calculators for mortgage, BMI, currency, age, tips, and more. No sign-up needed." />
  <meta property="og:image" content="https://nexalc.com/assets/og-home.png" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="NexAlc — Free Online Calculators" />
  <meta name="twitter:description" content="Calculate anything in seconds — free tools, clean results, no distractions." />
  <meta name="twitter:image" content="https://nexalc.com/assets/og-home.png" />

  <!-- Favicon -->
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

  <link rel="stylesheet" href="/fonts/fonts.css" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --orange: #FF6B2B;
      --near-black: #0E0E0F;
      --surface: #141416;
      --surface-2: #1A1A1E;
      --border: rgba(255, 255, 255, 0.08);
      --text-primary: #F0F0F2;
      --text-secondary: #C4C4CC;
      --text-muted: #8A8A99;
      --warm-white: #FAF9F6;
      --radius: 12px;
      --radius-sm: 8px;
    }
    body {
      background: var(--near-black);
      color: var(--text-primary);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 40px;
      max-width: 520px;
      width: 100%;
    }
    h1 {
      font-family: 'Syne', sans-serif;
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--warm-white);
      margin-bottom: 12px;
    }
    p {
      color: var(--text-secondary);
      font-size: 0.95rem;
      margin-bottom: 24px;
      line-height: 1.6;
    }
    .btn {
      display: inline-block;
      background: var(--orange);
      color: var(--near-black);
      font-weight: 700;
      padding: 12px 24px;
      border-radius: var(--radius-sm);
      text-decoration: none;
      transition: opacity 0.18s ease;
    }
    .btn:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Nex<span>Alc</span> Calculators</h1>
    <p>Explore free, fast, and accurate online calculators for mortgage, BMI, currency, percentage, age, tips, and countdowns.</p>
    <a href="/" class="btn">Explore All Tools →</a>
  </div>
</body>
</html>
