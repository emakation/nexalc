[build]
  publish = "."

[build.processing]
  skip_processing = false

[build.processing.html]
  pretty_urls = true

# 1. Consolidated New Year redirect rules (placed first with force = true)
[[redirects]]
  from = "/countdown-timer/new-year-eve"
  to = "/countdown-timer/new-year/"
  status = 301
  force = true

[[redirects]]
  from = "/countdown-timer/new-year-eve/"
  to = "/countdown-timer/new-year/"
  status = 301
  force = true

[[redirects]]
  from = "/countdown-timer/new-year-eve/index.html"
  to = "/countdown-timer/new-year/"
  status = 301
  force = true

# 2. Legacy tool redirects (consolidated from _redirects)
[[redirects]]
  from = "/loan-calculator"
  to = "/mortgage-calculator/"
  status = 301
  force = true

[[redirects]]
  from = "/loan-calculator/"
  to = "/mortgage-calculator/"
  status = 301
  force = true

[[redirects]]
  from = "/split-bill"
  to = "/tip-calculator/"
  status = 301
  force = true

[[redirects]]
  from = "/split-bill/"
  to = "/tip-calculator/"
  status = 301
  force = true

[[redirects]]
  from = "/currency"
  to = "/currency-converter/"
  status = 301
  force = true

[[redirects]]
  from = "/currency/"
  to = "/currency-converter/"
  status = 301
  force = true

[[redirects]]
  from = "/finance/compound-interest"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/finance/compound-interest/"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/calc/percentage"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/calc/percentage/"
  to = "/"
  status = 301
  force = true

# 3. Canonical trailing-slash 301 redirects for direct index.html requests
# (Non-trailing-slash directory routes like /percentage-calculator -> /percentage-calculator/
# are 301-redirected automatically by Netlify Pretty URLs above without breaking static assets
# or triggering Netlify URL-normalization redirect loops.)
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/percentage-calculator/index.html"
  to = "/percentage-calculator/"
  status = 301
  force = true

[[redirects]]
  from = "/tip-calculator/index.html"
  to = "/tip-calculator/"
  status = 301
  force = true

[[redirects]]
  from = "/currency-converter/index.html"
  to = "/currency-converter/"
  status = 301
  force = true

[[redirects]]
  from = "/countdown-timer/index.html"
  to = "/countdown-timer/"
  status = 301
  force = true

[[redirects]]
  from = "/mortgage-calculator/index.html"
  to = "/mortgage-calculator/"
  status = 301
  force = true

[[redirects]]
  from = "/age-calculator/index.html"
  to = "/age-calculator/"
  status = 301
  force = true

[[redirects]]
  from = "/bmi-calculator/index.html"
  to = "/bmi-calculator/"
  status = 301
  force = true

[[redirects]]
  from = "/auto-loan-calculator/index.html"
  to = "/auto-loan-calculator/"
  status = 301
  force = true

[[redirects]]
  from = "/blog/index.html"
  to = "/blog/"
  status = 301
  force = true

[[redirects]]
  from = "/blog/*/index.html"
  to = "/blog/:splat/"
  status = 301
  force = true

[[redirects]]
  from = "/countdown-timer/*/index.html"
  to = "/countdown-timer/:splat/"
  status = 301
  force = true

[[redirects]]
  from = "/guides/*/index.html"
  to = "/guides/:splat/"
  status = 301
  force = true
